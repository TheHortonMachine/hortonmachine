#
# HortonMachine dark theme.
#
# Same palette as HMLightLaf, with the blue and red lifted for contrast
# on a dark, slightly blue tinted background.
#
# Only the deltas to FlatDarkLaf are defined here, everything else is
# derived by FlatLaf from @accentColor, @background and @foreground.
#

#---- variables ----

@accentColor = #42A5F5
@background = #1E232B
@foreground = #DDE3EA
@hmDarkBlue = #90CAF9
@hmLogoBlue = #1796D4
@hmRed = #FF7A59
@selectionInactiveBackground = #1F4A73
@selectionInactiveForeground = @foreground

#---- shapes ----

Component.arc = 8
Button.arc = 8
TextComponent.arc = 8
CheckBox.arc = 4
ProgressBar.arc = 8
Component.focusWidth = 1
Component.innerFocusWidth = 0
Component.focusColor = fade(@accentColor,50%)
Component.focusedBorderColor = @accentColor

ScrollBar.thumbArc = 999
ScrollBar.thumbInsets = 2,2,2,2
ScrollBar.width = 12

#---- colors ----

Component.linkColor = @hmRed
TitledBorder.titleColor = @hmRed
TitledBorder.border = 1,1,1,1,darken(@accentColor,15%),1,8

TabbedPane.underlineColor = @accentColor
TabbedPane.selectedForeground = @accentColor
TabbedPane.hoverColor = lighten(@background,6%)
TabbedPane.focusColor = lighten(@background,8%)

TableHeader.background = lighten(@background,5%)
TableHeader.foreground = @hmDarkBlue
Table.alternateRowColor = lighten(@background,3%)

ProgressBar.foreground = @accentColor

# Material Symbols icons (see MaterialIcon)
HM.icon.foreground = @accentColor
HM.icon.runColor = #66BB6A
HM.icon.stopColor = @hmRed
HM.icon.accentColor = @hmRed

# filled primary buttons in the website blue: white on the lighter
# @accentColor would be too low in contrast
@hmButtonBlue = #1976D2
Button.default.background = @hmButtonBlue
Button.default.foreground = #FFFFFF
Button.default.borderColor = @hmButtonBlue
Button.default.focusedBorderColor = @accentColor
Button.default.focusedBackground = @hmButtonBlue
Button.default.hoverBackground = lighten(@hmButtonBlue,6%)
Button.default.hoverBorderColor = lighten(@hmButtonBlue,6%)
Button.default.pressedBackground = #1056A4
