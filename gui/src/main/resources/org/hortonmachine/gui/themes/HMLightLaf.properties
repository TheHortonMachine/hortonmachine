#
# HortonMachine light theme.
#
# Palette taken from https://g-ant.eu
#   primary blue     #1976D2  (header bar, tabs, borders)
#   dark blue        #1056A4  (titles)
#   logo blue        #1796D4
#   secondary red    #C24320  (call to action links, box titles)
#   text             #333333 on white
#
# Only the deltas to FlatLightLaf are defined here, everything else is
# derived by FlatLaf from @accentColor, @background and @foreground.
#

#---- variables ----

@accentColor = #1976D2
@background = #FAFAFA
@foreground = #333333
@hmDarkBlue = #1056A4
@hmLogoBlue = #1796D4
@hmRed = #C24320
@selectionInactiveBackground = lighten(@accentColor,42%)
@selectionInactiveForeground = @foreground

#---- shapes ----

Component.arc = 8
Button.arc = 8
TextComponent.arc = 8
CheckBox.arc = 4
ProgressBar.arc = 8
Component.focusWidth = 1
Component.innerFocusWidth = 0
Component.focusColor = fade(@accentColor,50%)
Component.focusedBorderColor = @accentColor

ScrollBar.thumbArc = 999
ScrollBar.thumbInsets = 2,2,2,2
ScrollBar.width = 12

#---- colors ----

Component.linkColor = @hmRed
TitledBorder.titleColor = @hmRed
TitledBorder.border = 1,1,1,1,@accentColor,1,8

TabbedPane.underlineColor = @accentColor
TabbedPane.selectedForeground = @accentColor
TabbedPane.hoverColor = lighten(@accentColor,50%)
TabbedPane.focusColor = lighten(@accentColor,52%)

TableHeader.background = lighten(@accentColor,50%)
TableHeader.foreground = @hmDarkBlue
Table.alternateRowColor = #F4F8FC

ProgressBar.foreground = @accentColor

# Material Symbols icons (see MaterialIcon)
HM.icon.foreground = @accentColor
HM.icon.runColor = #43A047
HM.icon.stopColor = @hmRed
HM.icon.accentColor = @hmRed

# filled primary buttons, as on the website
Button.default.background = @accentColor
Button.default.foreground = #FFFFFF
Button.default.borderColor = @accentColor
Button.default.focusedBorderColor = @hmDarkBlue
Button.default.focusedBackground = @accentColor
Button.default.hoverBackground = darken(@accentColor,6%)
Button.default.hoverBorderColor = darken(@accentColor,6%)
Button.default.pressedBackground = @hmDarkBlue
