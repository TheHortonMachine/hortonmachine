# The kinds of data the module fields read and write, for the script assistant.
#
# A path field inXxx reads, and a path field outXxx writes, data of the kind Xxx, so that the
# producers of what an input needs are found from the field names alone: inFlow takes what an
# outFlow writes. The model is told, for each input, which modules make it, and the scripts it
# writes are checked for inputs fed with the wrong kind (inFlow = the dem).
#
# This file adds what the names can't say. For a kind Xxx (the field name without in/out):
#
#   Xxx.description  what the data is, in a few words. Only described kinds are listed to the
#                    model in the overview of the kinds, so describe the ones scripts chain.
#   Xxx.aliases      other field names (without in/out) with data of this kind, e.g. Drain for Flow.
#   Xxx.accepts      other kinds an input of this kind takes as well, e.g. Elev takes a Pit.
#   Xxx.producers    the modules to propose first, in order; the others found follow by name.
#   Xxx.words        lower case words that, in a variable or file name, tell data of this kind
#                    (dem for Elev): they let the check see that inFlow = "/data/dem.tif" is wrong.
#
# generic: the kinds that only say raster or vector, of any content: they get no producers and
# are never checked. Kinds ending with digits (Raster1, Map2) are generic as well.
#
# Producers and consumers are matched only with the same data type (raster with raster, vector
# with vector). Changes here are picked up at the next start; TestDataKinds checks the file.

generic = Raster, Vector, Map, Geodata, File, Folder, Grid, Data, Table, Path, Mask

Elev.description = an elevation model (DEM, DTM): usually a file of the user; its depitted version (Pit) works too
Elev.aliases = Dtm, DTM, Dem, DEM, Elevation
Elev.accepts = Pit
Elev.words = dem, dtm, elev, elevation, dsm, srtm

Pit.description = the depitted elevation model, without depressions: the first step of the hydrological chain
Pit.producers = Pitfiller, DePitter, PitfillerBarnes
Pit.words = pit, depit, depitted, filled, pitfilled

Flow.description = the D8 drainage directions, computed from the depitted elevation model (Pit)
Flow.aliases = Drain, Flowdirections
Flow.producers = FlowDirections, DrainDir, DePitter, PitfillerBarnes
Flow.words = flow, flowdir, flowdirections, drain, draindir, drainage

Tca.description = the total contributing areas (upslope cells), computed from the drainage directions (Flow)
Tca.producers = Tca, DrainDir, PitfillerBarnes
Tca.words = tca, acc, accumulation, contributing

Net.description = the river network as a raster, extracted from the contributing areas (Tca) with a threshold
Net.producers = ExtractNetwork, PitfillerBarnes
Net.words = net, network, stream, streams, channels

Slope.description = the slope, computed from the elevation model (Elev or Pit)
Slope.producers = Slope, Gradient
Slope.words = slope, gradient

Basins.description = the subbasins numbered along the network, from NetNumbering
Basins.producers = NetNumbering
Basins.words = basins, subbasins
